<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" sizes="16x16" href="images/favicon.png">
    <script src="https://kit.fontawesome.com/b8659964f9.js" crossorigin="anonymous"></script>
</head>
<body>
    <img src="images/favicon.ico" alt="">
    <div id="searchContainer">
        <div id="searchBar"><i class="fa fa-search icon"></i><input type="search" id="searchInput" placeholder="My latest stories..."></div>
    </div>
    <div id="gridContainer">
        <div id="recentEntriesContainer">
            <h2>Recent Entries</h2>
            <div class="cardEntry">
                <div class="leftCard">
                    <i class="fa-solid fa-book"></i>
                    <div class="infoSection">
                        <h4 class="date">1/1/2026</h4>
                        <h3 class="title">New Year, New Me</h3>
                        <p class="description">Nothing compares to a good New Year's meal. The status of my resolutions, however... questionable. </p>
                    </div>
                </div>
                <div class="rightCard">
                    <i class="fa-solid fa-angle-right"></i>
                </div>
            </div>

            <div class="cardEntry">
                <div class="leftCard">
                    <i class="fa-solid fa-book"></i>
                    <div class="infoSection">
                        <h4 class="date">1/17/2026</h4>
                        <h3 class="title">College Results</h3>
                        <p class="description">The process of recieving college decisions is both nervewracking and incredibly exciting.</p>
                    </div>
                </div>
                <div class="rightCard">
                    <i class="fa-solid fa-angle-right"></i>
                </div>
            </div>
        </div>
        <div id="newEntriesContainer">
            <h2>Create New Entry</h2>
        </div>
        <div id="sideBar">
            <h4>Filler content</h4>
        </div>
    </div>


    <script src="main.js"></script>
</body>
</html>
